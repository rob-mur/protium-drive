name: promotion
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release to promote
        required: true
        type: string
      target:
        description: Environment to promote into
        required: true
        type: string
concurrency:
  group: cd-environment-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  cd-pipeline:
    uses: rob/continuous-delivery/.cd/workflows/promotion.yml@95689d9d3151af154af60c4997453b9281e2d343
    with:
      release: ${{ inputs.release }}
      runs-on: nix-host-2cpu-4gb
      target: ${{ inputs.target }}

name: acknowledgement-gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
concurrency:
  group: acknowledgement-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  cd-pipeline:
    uses: rob/continuous-delivery/.cd/workflows/acknowledgement-gate.yml@17afa1976732a85b84f2cd22ee0b4bac779fbdb9
    with:
      gate-reviewer: cd-pipeline
      runs-on: nix-host-2cpu-4gb
    secrets:
      CD_PIPELINE_TOKEN: ${{ secrets.CD_PIPELINE_TOKEN }}

name: acknowledgement-gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
concurrency:
  group: acknowledgement-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  cd-pipeline:
    uses: rob/continuous-delivery/.cd/workflows/acknowledgement-gate.yml@62058abc0c46a7bd15af867ea62aa9d55f9d55b5
    with:
      gate-reviewer: cd-pipeline
      runs-on: nix-host-2cpu-4gb

name: teardown

on:
  pull_request:
    types: [closed]

concurrency:
  group: cd-environment-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: devenv shell bash -- -e {0}

env:
  CI_ENVIRONMENT: pr-${{ github.event.pull_request.number }}

jobs:
  teardown:
    name: "ci:deploy:teardown"
    runs-on: nix-host-2cpu-4gb
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: cd-run ci:deploy:teardown

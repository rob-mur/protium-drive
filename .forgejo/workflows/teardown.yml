name: teardown
on:
  pull_request:
    types: [closed]
concurrency:
  group: cd-environment-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  cd-pipeline:
    uses: rob/continuous-delivery/.cd/workflows/teardown.yml@17afa1976732a85b84f2cd22ee0b4bac779fbdb9
    with:
      runs-on: nix-host-2cpu-4gb

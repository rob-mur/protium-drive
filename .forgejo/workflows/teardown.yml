name: teardown
on:
  pull_request:
    types: [closed]
concurrency:
  group: cd-environment-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  cd-pipeline:
    uses: rob/continuous-delivery/.cd/workflows/teardown.yml@95689d9d3151af154af60c4997453b9281e2d343
    with:
      runs-on: nix-host-2cpu-4gb

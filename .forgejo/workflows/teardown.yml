name: teardown
on:
  pull_request:
    types: [closed]
concurrency:
  group: cd-environment-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  cd-pipeline:
    uses: rob/continuous-delivery/.cd/workflows/teardown.yml@62058abc0c46a7bd15af867ea62aa9d55f9d55b5
    with:
      runs-on: nix-host-2cpu-4gb

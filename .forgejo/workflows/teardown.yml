name: teardown
on:
  pull_request:
    types: [closed]
concurrency:
  group: cd-environment-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  cd-pipeline:
    uses: rob/continuous-delivery/.cd/workflows/teardown.yml@3d0f828f19e2775c0c8cae9a3c6d04ed8a6568d5
    with:
      runs-on: nix-host-2cpu-4gb

name: merge-request
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: cd-environment-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  cd-pipeline:
    uses: rob/continuous-delivery/.cd/workflows/merge-request.yml@62058abc0c46a7bd15af867ea62aa9d55f9d55b5
    with:
      acceptance-budget: "600"
      acceptance-runs-on: nix-host-2cpu-4gb-fuse
      commit-budget: "300"
      gate-reviewer: cd-pipeline
      runs-on: nix-host-2cpu-4gb

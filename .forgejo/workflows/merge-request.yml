name: merge-request
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: cd-environment-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  cd-pipeline:
    uses: rob/continuous-delivery/.cd/workflows/merge-request.yml@3d0f828f19e2775c0c8cae9a3c6d04ed8a6568d5
    with:
      acceptance-budget: "600"
      acceptance-runs-on: nix-host-2cpu-4gb-fuse
      commit-budget: "300"
      gate-reviewer: cd-pipeline
      runs-on: nix-host-2cpu-4gb
    secrets:
      CD_PIPELINE_TOKEN: ${{ secrets.CD_PIPELINE_TOKEN }}
      REGISTRY_KEY_BASE64: ${{ secrets.REGISTRY_KEY_BASE64 }}

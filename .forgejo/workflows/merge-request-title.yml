name: merge-request-title
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
concurrency:
  group: merge-request-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  cd-pipeline:
    uses: rob/continuous-delivery/.cd/workflows/merge-request-title.yml@30406a46bb9d1aba4df70782a2c16ff540523604
    with:
      runs-on: nix-host-2cpu-4gb

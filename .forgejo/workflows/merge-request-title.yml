name: merge-request-title
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
concurrency:
  group: merge-request-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  cd-pipeline:
    uses: rob/continuous-delivery/.cd/workflows/merge-request-title.yml@3d0f828f19e2775c0c8cae9a3c6d04ed8a6568d5
    with:
      runs-on: nix-host-2cpu-4gb

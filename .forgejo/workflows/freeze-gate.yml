name: freeze-gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: freeze-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  cd-pipeline:
    uses: rob/continuous-delivery/.cd/workflows/freeze-gate.yml@3d0f828f19e2775c0c8cae9a3c6d04ed8a6568d5
    with:
      runs-on: nix-host-2cpu-4gb

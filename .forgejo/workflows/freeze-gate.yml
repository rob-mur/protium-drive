name: freeze-gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: freeze-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  cd-pipeline:
    uses: rob/continuous-delivery/.cd/workflows/freeze-gate.yml@17afa1976732a85b84f2cd22ee0b4bac779fbdb9
    with:
      runs-on: nix-host-2cpu-4gb

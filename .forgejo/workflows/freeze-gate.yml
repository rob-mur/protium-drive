name: freeze-gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: freeze-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  cd-pipeline:
    uses: rob/continuous-delivery/.cd/workflows/freeze-gate.yml@30406a46bb9d1aba4df70782a2c16ff540523604
    with:
      runs-on: nix-host-2cpu-4gb
